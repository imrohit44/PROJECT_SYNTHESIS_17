services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pybank_docker}
      POSTGRES_USER: ${POSTGRES_USER:-pybank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pybank_docker_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pybank_postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pybank

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pybank

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - pybank

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-PyBank}
      APP_ENV: ${APP_ENV:-docker-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${PYBANK_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pybank:pybank_docker_password@postgres:5432/pybank_docker}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CUSTOMER_CACHE_TTL_SECONDS: ${CUSTOMER_CACHE_TTL_SECONDS:-300}
      ACCOUNT_CACHE_TTL_SECONDS: ${ACCOUNT_CACHE_TTL_SECONDS:-60}
      ACCOUNT_LIST_CACHE_TTL_SECONDS: ${ACCOUNT_LIST_CACHE_TTL_SECONDS:-60}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-pybank}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-pybank-audit-consumer}
      JWT_SECRET: ${JWT_SECRET:-change-this-docker-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      # Phase 14: read-only banking assistant. Leave LLM_API_KEY empty to keep
      # the assistant disabled (503) while the rest of the API stays healthy.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-512}
      LLM_MAX_TOOL_CALLS: ${LLM_MAX_TOOL_CALLS:-3}
      ASSISTANT_MAX_INPUT_CHARS: ${ASSISTANT_MAX_INPUT_CHARS:-2000}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-10}
      ASSISTANT_RATE_WINDOW_SECONDS: ${ASSISTANT_RATE_WINDOW_SECONDS:-60}
      FRAUD_SERVICE_URL: ${FRAUD_SERVICE_URL:-http://fraud:8000}
      FRAUD_SERVICE_TIMEOUT_SECONDS: ${FRAUD_SERVICE_TIMEOUT_SECONDS:-5}
      # Phase 15: real-time consumer group + optional outbound WhatsApp.
      # WHATSAPP_ENABLED=false keeps banking and WebSocket delivery fully
      # functional without any external provider calls.
      REALTIME_CONSUMER_GROUP: ${REALTIME_CONSUMER_GROUP:-pybank-realtime-consumer}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloud_api}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v18.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_SENDER_ID: ${WHATSAPP_SENDER_ID:-}
      WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-5}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pybank

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pybank

  neo4j:
    # Pinned Neo4j 5.x Community image (no Enterprise-only features).
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-pybank_neo4j_password}
      # Local-learning memory footprint; explicit rather than defaults.
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - pybank_neo4j_data:/data
    healthcheck:
      # The password lives inside NEO4J_AUTH (neo4j/<password>); NEO4J_PASSWORD
      # itself is not a valid Neo4j setting, so it is parsed here instead.
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$(echo $$NEO4J_AUTH | cut -d/ -f2)\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - pybank

  fraud:
    build:
      # Build context is the repository root so the shared services/common
      # package can be copied into the image. Fraud remains independently
      # deployable: it has its own Dockerfile, dependencies and migrations.
      context: .
      dockerfile: services/fraud/Dockerfile
    ports:
      - "${FRAUD_HOST_PORT:-8001}:8000"
    environment:
      APP_NAME: ${APP_NAME:-PyBankFraud}
      APP_ENV: ${APP_ENV:-docker-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${PYBANK_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRAUD_DATABASE_URL: ${FRAUD_DATABASE_URL:-postgresql+psycopg://pybank:pybank_docker_password@postgres:5432/pybank_fraud}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # Single shared topic. The event type lives in the envelope, not the topic
      # name, so transfer.completed and risk.assessed travel on pybank.events.
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pybank.events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP_FRAUD:-pybank-fraud-consumer}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pybank_neo4j_password}
      GRAPH_LOOKBACK_HOURS: ${GRAPH_LOOKBACK_HOURS:-24}
      GRAPH_WEIGHT: ${GRAPH_WEIGHT:-0.25}
      GRAPH_MAX_ADJUSTMENT: ${GRAPH_MAX_ADJUSTMENT:-0.15}
      # Explicit escape hatch: GRAPH_ENABLED=false degrades fraud to the
      # Phase 12 rule + ML baseline without touching Neo4j at all.
      GRAPH_ENABLED: ${GRAPH_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      # Neo4j is an ADVISORY dependency: fraud degrades gracefully when it is
      # unavailable, so startup only waits if it is present, never fails on it.
      neo4j:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pybank

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      QUERY_BASE_PATH: /
    ports:
      # UI/query API only; OTLP ingestion (4317/4318) stays on the compose network.
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:16686/api/services"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pybank

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
      fraud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pybank

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pybank_grafana_password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/pybank-dashboard.json:/var/lib/grafana/dashboards/pybank-dashboard.json:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - pybank

volumes:
  pybank_postgres_data:
  pybank_neo4j_data:

networks:
  pybank:
    driver: bridge
