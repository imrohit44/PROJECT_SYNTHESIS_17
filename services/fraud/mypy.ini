[mypy]
python_version = 3.12
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
# Keep the fraud type-check single-rooted at the repository root: pybank is
# installed editable with services.* visible as a regular package, so no
# mypy_path override is needed (it would re-discover the same files a second
# time under a second module name).
namespace_packages = True
exclude = alembic/versions

[mypy-confluent_kafka.*]
ignore_missing_imports = True

[mypy-opentelemetry.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_unused_ignores = False
ignore_missing_imports = True

[mypy-app.domain.rules]
ignore_missing_imports = False
