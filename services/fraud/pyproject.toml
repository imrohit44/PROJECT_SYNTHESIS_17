[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybank-fraud"
version = "0.1.0"
description = "Fraud/Risk Service for PyBank."
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.1,<25.0",
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "confluent-kafka>=2.6,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-sdk>=1.29,<2.0",
    "opentelemetry-api>=1.29,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "scikit-learn>=1.5,<2.0",
    "numpy>=2.0,<3.0",
    "joblib>=1.4,<2.0",
    "neo4j>=5.25,<6.0",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2,<4.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pandas>=2.2,<4.0",
    # Phase 17: pytest >= 9.0.3 fixes PYSEC-2026-1845 / CVE-2025-71176;
    # pytest-asyncio 1.x is the pytest-9-compatible line.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["/main.py", "alembic/versions", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "alembic/env.py" = [
    "E402",
    "I001",
] }

[tool.ruff.format]
quote-style = "double"

# mypy configuration lives in mypy.ini, which takes precedence over this file.
