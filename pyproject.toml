[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybank"
version = "0.1.0"
description = "Project Synthesis 17: a progressive software engineering learning project for banking systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.1,<25.0",
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "confluent-kafka>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.9,<3.0",
    "redis>=5.2,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-sdk>=1.29,<2.0",
    "opentelemetry-api>=1.29,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # Phase 14 runtime dependency: the assistant's LLM client
    # (backend/app/llm/client.py) and the fraud-assessment tool
    # (backend/app/assistant/tools.py) call HTTP APIs at request time, so
    # httpx must be installed in the production image, not just dev.
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    # Phase 17: pytest >= 9.0.3 fixes PYSEC-2026-1845 / CVE-2025-71176
    # (TOCTOU race in tmp/basetemp directory handling). pytest-asyncio 1.x is
    # the pytest-9-compatible line.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "services*"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# The fraud service is an independent deployable with its own mypy config
# (services/fraud/mypy.ini) and its own root-relative imports. Type-checking it
# from the repository root would re-discover a second `env` module from its
# alembic directory, so it is excluded here and checked separately.
exclude = ["^services/fraud/", "^alembic/versions/", "^frontend/", "^artifacts/"]

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false

# The rate-limit and cache unit tests inject a hand-rolled fake Redis that
# intentionally implements only the subset of the redis-py API those tests
# exercise. A targeted disable (not a global rule relaxation) keeps mypy green
# without forcing interface changes on production code.
[[tool.mypy.overrides]]
module = [
    "backend.tests.security.test_rate_limit_redis",
    "backend.tests.infrastructure.test_cache",
]
disable_error_code = ["assignment", "arg-type"]

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = [
    "unit: isolated domain, application, and security logic",
    "integration: API and persistence tests using a test database",
    "security: authentication, authorization, and ownership regression tests",
    "e2e: browser-driven smoke tests across frontend, backend, and database",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
target-version = "py312"
line-length = 88
# "/main.py" anchors to the repository root so only the legacy standalone
# script is skipped; backend/app/main.py and services/fraud/app/main.py are
# linted normally.
exclude = ["/main.py", "frontend/node_modules", "frontend/dist", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "backend/app/api/**/*.py" = [
    "B008",
], "**/alembic/env.py" = [
    "E402",
    "I001",
] }

[tool.ruff.format]
quote-style = "double"
