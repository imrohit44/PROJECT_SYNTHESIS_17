[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybank"
version = "0.1.0"
description = "A progressive software engineering learning project for banking systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = [
    "unit: isolated domain, application, and security logic",
    "integration: API and persistence tests using a test database",
    "security: authentication, authorization, and ownership regression tests",
    "e2e: browser-driven smoke tests across frontend, backend, and database",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["main.py", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = {"backend/app/api/**/*.py" = ["B008"]}

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
