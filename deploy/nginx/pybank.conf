# Project Synthesis 17 production reverse proxy (Phase 16).
#
# This is the ONLY component that faces the public internet. It terminates
# TLS and forwards to the two loopback-bound application ports created by
# docker-compose.prod.yml:
#
#   /                -> 127.0.0.1:8080  (React SPA, static files)
#   /api/            -> 127.0.0.1:8000  (FastAPI, banking + fraud-facing routes)
#   /api/v1/ws       -> 127.0.0.1:8000  (WebSocket, Phase 15 realtime)
#
# PostgreSQL, Redis, Kafka, Neo4j, Prometheus, Grafana and Jaeger are not
# referenced here at all and publish no host port, so they have no path from
# the internet to this file.
#
# Business logic stays in the application. This file only routes, terminates
# TLS, and sets transport-level headers.

upstream pybank_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream pybank_frontend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Map the client protocol so a single server block can redirect HTTP to HTTPS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the Phase 11+ correlation ID across the proxy. If the client
# supplied one, forward it; otherwise Nginx mints a fresh, unique ID.
# This map MUST live in the http context, not inside a server block.
map $http_x_correlation_id $pybank_correlation_id {
    ""      $request_id;
    default $http_x_correlation_id;
}

# Reject oversized request bodies early. The LLM assistant sends the largest
# legitimate payloads, so the limit is set above the API's own bound rather
# than below it.
limit_req_zone $binary_remote_addr zone=pybank_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME (Let's Encrypt) HTTP-01 validation must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificate paths. Certificates are never committed: they are obtained
    # on the host by certbot and live only in /etc/letsencrypt.
    ssl_certificate     /etc/letsencrypt/live/pybank/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pybank/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:PyBankTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS. Only safe once HTTPS is confirmed working, because a browser that
    # receives this header will refuse to fall back to plain HTTP for the
    # max-age period. Enable after the first successful certificate issuance.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The SPA is same-origin with the API, so scripts may only load from this
    # origin. 'unsafe-inline' for styles is required by the existing app and
    # is not a script-src relaxation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 8m;
    proxy_buffering off;

    # ---------------------------------------------------------- realtime ----
    # WebSocket upgrade for the Phase 15 realtime channel. Long read timeout
    # because the socket is a persistent connection, not a request.
    location /api/v1/ws {
        proxy_pass http://pybank_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID  $pybank_correlation_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------- api ---
    location /api/ {
        limit_req zone=pybank_api burst=60 nodelay;
        proxy_pass http://pybank_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID  $pybank_correlation_id;
        # The LLM assistant can take longer than the 60s default.
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------ frontend --
    location / {
        proxy_pass http://pybank_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
